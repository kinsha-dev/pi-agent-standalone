<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>pi-Agent run-control gauntlet</title>
<desc>An incoming task passes four gates in series — same-task dedup, minimum interval, daily run cap, and daily token budget — before it is cleared to run. Tripping any gate skips the run with a reason. PI_FORCE bypasses all four.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.t14{font-size:14px;font-weight:500}.t12{font-size:12px}
rect.gray{fill:#F1EFE8;stroke:#5F5E5A}.gray-t{fill:#444441}.gray-s{fill:#5F5E5A}
rect.teal{fill:#E1F5EE;stroke:#0F6E56}.teal-t{fill:#085041}.teal-s{fill:#0F6E56}
rect.coral{fill:#FAECE7;stroke:#993C1D}.coral-t{fill:#712B13}.coral-s{fill:#993C1D}
.edge{stroke:#888780}
@media (prefers-color-scheme:dark){
rect.gray{fill:#444441;stroke:#B4B2A9}.gray-t{fill:#D3D1C7}.gray-s{fill:#B4B2A9}
rect.teal{fill:#085041;stroke:#5DCAA5}.teal-t{fill:#9FE1CB}.teal-s{fill:#5DCAA5}
rect.coral{fill:#712B13;stroke:#F0997B}.coral-t{fill:#F5C4B3}.coral-s{fill:#F0997B}
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect class="gray" x="240" y="24" width="200" height="36" rx="8" stroke-width="0.5"/>
<text class="t14 gray-t" x="340" y="42" text-anchor="middle" dominant-baseline="central">incoming task</text>
<line class="edge" x1="340" y1="60" x2="340" y2="80" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="gray" x="240" y="82" width="200" height="46" rx="8" stroke-width="0.5"/>
<text class="t14 gray-t" x="340" y="105" text-anchor="middle" dominant-baseline="central">same-task dedup</text>
<line class="edge" x1="340" y1="128" x2="340" y2="146" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="gray" x="240" y="148" width="200" height="46" rx="8" stroke-width="0.5"/>
<text class="t14 gray-t" x="340" y="171" text-anchor="middle" dominant-baseline="central">minimum interval</text>
<line class="edge" x1="340" y1="194" x2="340" y2="212" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="gray" x="240" y="214" width="200" height="46" rx="8" stroke-width="0.5"/>
<text class="t14 gray-t" x="340" y="237" text-anchor="middle" dominant-baseline="central">daily run cap</text>
<line class="edge" x1="340" y1="260" x2="340" y2="278" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="gray" x="240" y="280" width="200" height="46" rx="8" stroke-width="0.5"/>
<text class="t14 gray-t" x="340" y="303" text-anchor="middle" dominant-baseline="central">daily token budget</text>
<line class="edge" x1="340" y1="326" x2="340" y2="344" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="teal" x="240" y="346" width="200" height="46" rx="8" stroke-width="0.5"/>
<text class="t14 teal-t" x="340" y="369" text-anchor="middle" dominant-baseline="central">clear to run</text>

<text class="t12 gray-s" x="555" y="192" text-anchor="middle" dominant-baseline="central">any gate trips</text>
<line class="edge" x1="442" y1="237" x2="476" y2="237" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect class="coral" x="478" y="208" width="162" height="58" rx="8" stroke-width="0.5"/>
<text class="t14 coral-t" x="559" y="228" text-anchor="middle" dominant-baseline="central">skipped</text>
<text class="t12 coral-s" x="559" y="248" text-anchor="middle" dominant-baseline="central">returns reason + force hint</text>

<path d="M240 42 L180 42 L180 369 L238 369" class="edge" fill="none" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="t12 gray-s" x="110" y="205" text-anchor="middle" dominant-baseline="central">PI_FORCE=1</text>
</svg>
